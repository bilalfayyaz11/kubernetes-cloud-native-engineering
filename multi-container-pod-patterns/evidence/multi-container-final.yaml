  creationTimestamp: "2026-09-18T15:51:03Z"
  generation: 1
  labels:
    app: multi-container-app
    pattern: sidecar
  name: multi-container-app
  namespace: pod-patterns
  resourceVersion: "505"
  uid: 873f07fc-5e34-49cf-a52e-545a257599bd
spec:
  containers:
  - args:
    - |
      set -e

      echo "Starting web application..."
      echo
      echo "Configuration available to main container:"
      cat /etc/app-config/app.conf

      echo
      echo "Starting Nginx..."

      exec nginx -g 'daemon off;'
    command:
    - /bin/sh
    - -c
    image: nginx:alpine
    imagePullPolicy: IfNotPresent
    livenessProbe:
      failureThreshold: 3
      httpGet:
        path: /
        port: 80
        scheme: HTTP
      initialDelaySeconds: 10
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 1
    name: web-app
    ports:
    - containerPort: 80
      name: http
      protocol: TCP
    readinessProbe:
      failureThreshold: 3
      httpGet:
        path: /
        port: 80
        scheme: HTTP
      initialDelaySeconds: 2
      periodSeconds: 5
      successThreshold: 1
      timeoutSeconds: 1
    resources:
      limits:
        cpu: 200m
        memory: 128Mi
      requests:
        cpu: 25m
        memory: 32Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /var/log/nginx
      name: shared-logs
    - mountPath: /etc/app-config
      name: config-volume
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-ll7hs
      readOnly: true
  - args:
    - |
      set -e

      echo "Logging sidecar starting..."
      echo "Waiting for Nginx access log..."

      while [ ! -f /var/log/nginx/access.log ]; do
          sleep 1
      done

      echo "Access log detected."
      echo "Following application requests..."

      exec tail -n 0 -F /var/log/nginx/access.log
    command:
    - /bin/sh
    - -c
    image: busybox:stable
    imagePullPolicy: IfNotPresent
    name: log-sidecar
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /var/log/nginx
      name: shared-logs
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-ll7hs
      readOnly: true
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  initContainers:
  - args:
    - |
      set -e

      echo "Initializing application configuration..."

      cat > /config/app.conf << 'CONFIG'
      server_name=web-app
      log_level=info
      port=8080
      CONFIG

      echo "Configuration created:"
      cat /config/app.conf

      echo "Preparing shared log files..."

      touch /logs/access.log
      touch /logs/error.log

      chmod 666 /logs/access.log
      chmod 666 /logs/error.log

      echo "Initialization complete."
    command:
    - /bin/sh
    - -c
    image: busybox:stable
    imagePullPolicy: IfNotPresent
    name: config-setup
    resources: {}
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /config
      name: config-volume
    - mountPath: /logs
      name: shared-logs
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-ll7hs
      readOnly: true
  nodeName: minikube
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300
  volumes:
  - emptyDir: {}
    name: shared-logs
  - emptyDir: {}
    name: config-volume
  - name: kube-api-access-ll7hs
    projected:
      defaultMode: 420
      sources:
      - serviceAccountToken:
          expirationSeconds: 3607
          path: token
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: kube-root-ca.crt
      - downwardAPI:
          items:
          - fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
            path: namespace
