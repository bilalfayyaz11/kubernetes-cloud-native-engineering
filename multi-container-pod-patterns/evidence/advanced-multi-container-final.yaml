  creationTimestamp: "2026-09-18T15:53:50Z"
  generation: 1
  labels:
    app: advanced-multi-container
    pattern: multi-sidecar
  name: advanced-multi-container
  namespace: pod-patterns
  resourceVersion: "787"
  uid: 17892376-8cd2-4294-8392-367fca798cae
spec:
  containers:
  - args:
    - |
      set -e

      echo "Main application starting..."

      while true; do

          if [ -f /data/input/sample.txt ]; then

              {
                  echo "Processing: $(cat /data/input/sample.txt)"
                  echo "Processed at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              } > /data/output/processed.txt

          fi

          sleep 15

      done
    command:
    - /bin/sh
    - -c
    image: busybox:stable
    imagePullPolicy: IfNotPresent
    name: main-app
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /data
      name: shared-data
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-q7bvh
      readOnly: true
  - args:
    - |
      set -e

      echo "Monitor sidecar starting..."

      while true; do

          echo "=== Monitoring shared data $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="

          echo "Input files:"
          ls -lah /data/input 2>/dev/null || true

          echo
          echo "Output files:"
          ls -lah /data/output 2>/dev/null || true

          if [ -f /data/output/processed.txt ]; then
              echo
              echo "Latest processed result:"
              cat /data/output/processed.txt
          fi

          echo
          echo "---"

          sleep 10

      done
    command:
    - /bin/sh
    - -c
    image: busybox:stable
    imagePullPolicy: IfNotPresent
    name: monitor-sidecar
    resources:
      limits:
        cpu: 100m
        memory: 64Mi
      requests:
        cpu: 10m
        memory: 16Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /data
      name: shared-data
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-q7bvh
      readOnly: true
  - args:
    - |
      set -e

      echo "Cleanup sidecar starting..."

      while true; do

          echo "Running cleanup at $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          find /data/tmp \
            -type f \
            -name '*.tmp' \
            -mmin +1 \
            -delete \
            2>/dev/null || true

          sleep 20

      done
    command:
    - /bin/sh
    - -c
    image: busybox:stable
    imagePullPolicy: IfNotPresent
    name: cleanup-sidecar
    resources:
      limits:
        cpu: 50m
        memory: 32Mi
      requests:
        cpu: 5m
        memory: 8Mi
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /data
      name: shared-data
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-q7bvh
      readOnly: true
  dnsPolicy: ClusterFirst
  enableServiceLinks: true
  initContainers:
  - args:
    - |
      set -e

      echo "Initializing shared data..."

      mkdir -p /data/input
      mkdir -p /data/output
      mkdir -p /data/tmp

      echo "Sample data for processing" \
        > /data/input/sample.txt

      echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        > /data/input/metadata.txt

      echo "temporary artifact" \
        > /data/tmp/sample.tmp

      echo
      echo "Initial data:"
      find /data -maxdepth 2 -type f -print

      echo
      echo "Data initialization complete."
    command:
    - /bin/sh
    - -c
    image: busybox:stable
    imagePullPolicy: IfNotPresent
    name: data-initializer
    resources: {}
    terminationMessagePath: /dev/termination-log
    terminationMessagePolicy: File
    volumeMounts:
    - mountPath: /data
      name: shared-data
    - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
      name: kube-api-access-q7bvh
      readOnly: true
  nodeName: minikube
  preemptionPolicy: PreemptLowerPriority
  priority: 0
  restartPolicy: Always
  schedulerName: default-scheduler
  securityContext: {}
  serviceAccount: default
  serviceAccountName: default
  terminationGracePeriodSeconds: 30
  tolerations:
  - effect: NoExecute
    key: node.kubernetes.io/not-ready
    operator: Exists
    tolerationSeconds: 300
  - effect: NoExecute
    key: node.kubernetes.io/unreachable
    operator: Exists
    tolerationSeconds: 300
  volumes:
  - emptyDir: {}
    name: shared-data
  - name: kube-api-access-q7bvh
    projected:
      defaultMode: 420
      sources:
      - serviceAccountToken:
          expirationSeconds: 3607
          path: token
      - configMap:
          items:
          - key: ca.crt
            path: ca.crt
          name: kube-root-ca.crt
      - downwardAPI:
          items:
          - fieldRef:
              apiVersion: v1
              fieldPath: metadata.namespace
            path: namespace
