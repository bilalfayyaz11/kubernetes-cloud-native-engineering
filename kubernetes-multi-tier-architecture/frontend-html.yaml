apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: multi-tier-app
data:
  index.html: |
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>Multi-Tier Kubernetes Application</title>
    </head>
    <body>
      <h1>Multi-Tier Kubernetes Application</h1>
      <p>Frontend → Backend → Database</p>

      <button onclick="callApi('/api/health')">Backend Health</button>
      <button onclick="callApi('/api/data')">Database Check</button>

      <pre id="result"></pre>

      <script>
        async function callApi(path) {
          const response = await fetch(path);
          const data = await response.json();
          document.getElementById('result').textContent =
            JSON.stringify(data, null, 2);
        }
      </script>
    </body>
    </html>
