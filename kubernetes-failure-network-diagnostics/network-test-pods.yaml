apiVersion: v1
kind: Pod
metadata:
  name: client-pod
  labels:
    app: network-test
    role: client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      resources:
        requests:
          memory: "32Mi"
          cpu: "100m"
        limits:
          memory: "64Mi"
          cpu: "250m"
---
apiVersion: v1
kind: Pod
metadata:
  name: server-pod
  labels:
    app: network-test
    role: server
spec:
  containers:
    - name: server
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
spec:
  selector:
    role: server
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
  type: ClusterIP
