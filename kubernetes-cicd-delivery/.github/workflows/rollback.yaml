name: Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      revision:
        description: "Revision to restore. Leave blank for previous revision."
        required: false
        type: string

jobs:

  rollback:
    runs-on:
      - self-hosted
      - linux
      - kubernetes

    steps:
    - name: Display history
      run: kubectl rollout history deployment/cicd-app

    - name: Rollback
      shell: bash
      run: |
        REVISION="${{ inputs.revision }}"

        if [ -n "$REVISION" ]; then
          kubectl rollout undo deployment/cicd-app \
            --to-revision="$REVISION"
        else
          kubectl rollout undo deployment/cicd-app
        fi

    - name: Verify rollback
      run: |
        kubectl rollout status deployment/cicd-app \
          --timeout=300s

        kubectl get pods -l app=cicd-app

        kubectl run rollback-health-check \
          --image=curlimages/curl:8.10.1 \
          --restart=Never \
          --rm \
          -i \
          -- curl -fsS http://cicd-app-service/health
