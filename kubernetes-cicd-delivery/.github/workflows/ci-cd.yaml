name: Kubernetes CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: cicd-app

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

    - name: Dependency audit
      run: npm audit --audit-level=high


  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build container
      uses: docker/build-push-action@v6
      with:
        context: .
        push: false
        tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max


  publish:
    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Define image
      id: image
      run: |
        IMAGE="docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${GITHUB_SHA}"
        echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: |
          ${{ steps.image.outputs.image }}
          docker.io/${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max


  deploy:
    needs: publish

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on:
      - self-hosted
      - linux
      - kubernetes

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Verify Kubernetes connectivity
      run: |
        kubectl config current-context
        kubectl get nodes

    - name: Deploy application
      env:
        IMAGE: ${{ needs.publish.outputs.image }}
      run: |
        kubectl apply -f k8s/base/service.yaml
        kubectl apply -f k8s/base/deployment.yaml

        kubectl set image deployment/cicd-app \
          cicd-app="$IMAGE"

        kubectl set env deployment/cicd-app \
          APP_VERSION="${GITHUB_SHA::7}"

    - name: Verify rollout
      run: |
        kubectl rollout status deployment/cicd-app \
          --timeout=300s

        kubectl get pods -l app=cicd-app

    - name: Health check
      run: |
        kubectl run deployment-health-check \
          --image=curlimages/curl:8.10.1 \
          --restart=Never \
          --rm \
          -i \
          -- curl -fsS http://cicd-app-service/health
