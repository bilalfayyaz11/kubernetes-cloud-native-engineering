apiVersion: v1
kind: ServiceAccount
metadata:
  name: webapp-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-controller
  namespace: default
rules:
  - apiGroups:
      - platform.example
    resources:
      - webapps
      - webapps/status
    verbs:
      - get
      - list
      - watch
      - patch
      - update

  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/status
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update

  - apiGroups:
      - ""
    resources:
      - services
      - pods
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webapp-controller
  namespace: default
subjects:
  - kind: ServiceAccount
    name: webapp-controller
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: webapp-controller
