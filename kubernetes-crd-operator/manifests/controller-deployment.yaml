apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-controller
  namespace: default
  labels:
    app.kubernetes.io/name: webapp-controller
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-controller

  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp-controller

    spec:
      serviceAccountName: webapp-controller

      containers:
        - name: controller
          image: webapp-controller:1.0.6
          imagePullPolicy: IfNotPresent

          env:
            - name: RECONCILE_INTERVAL
              value: "5"

          resources:
            requests:
              cpu: 20m
              memory: 64Mi

            limits:
              cpu: 100m
              memory: 128Mi
