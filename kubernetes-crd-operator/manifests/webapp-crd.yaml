apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.platform.example
spec:
  group: platform.example

  scope: Namespaced

  names:
    plural: webapps
    singular: webapp
    kind: WebApp
    shortNames:
      - wa

  versions:
    - name: v1
      served: true
      storage: true

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas

        - name: Available
          type: integer
          jsonPath: .status.availableReplicas

        - name: Image
          type: string
          jsonPath: .spec.image

        - name: Ready
          type: string
          jsonPath: .status.conditions[0].status

      schema:
        openAPIV3Schema:
          type: object

          properties:
            apiVersion:
              type: string

            kind:
              type: string

            metadata:
              type: object

            spec:
              type: object

              required:
                - replicas
                - image
                - port

              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10

                image:
                  type: string
                  minLength: 1

                port:
                  type: integer
                  minimum: 1
                  maximum: 65535

                env:
                  type: array
                  items:
                    type: object

                    required:
                      - name
                      - value

                    properties:
                      name:
                        type: string
                        minLength: 1

                      value:
                        type: string

            status:
              type: object

              properties:
                observedGeneration:
                  type: integer
                  format: int64

                availableReplicas:
                  type: integer
                  minimum: 0

                conditions:
                  type: array

                  items:
                    type: object

                    required:
                      - type
                      - status
                      - lastTransitionTime
                      - reason
                      - message

                    properties:
                      type:
                        type: string

                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - "Unknown"

                      observedGeneration:
                        type: integer
                        format: int64

                      lastTransitionTime:
                        type: string
                        format: date-time

                      reason:
                        type: string

                      message:
                        type: string
