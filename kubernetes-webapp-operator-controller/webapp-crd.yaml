apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: webapps.example.com
spec:
  group: example.com

  scope: Namespaced

  names:
    plural: webapps
    singular: webapp
    kind: WebApp
    shortNames:
      - wa

  versions:
    - name: v1
      served: true
      storage: true

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Available
          type: integer
          jsonPath: .status.availableReplicas
        - name: Image
          type: string
          jsonPath: .spec.image
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10

                image:
                  type: string
                  minLength: 1

                port:
                  type: integer
                  minimum: 1
                  maximum: 65535

                resources:
                  type: object

                  properties:
                    cpu:
                      type: string

                    memory:
                      type: string

              required:
                - replicas
                - image
                - port

            status:
              type: object

              properties:
                availableReplicas:
                  type: integer
                  minimum: 0

                conditions:
                  type: array

                  items:
                    type: object

                    properties:
                      type:
                        type: string

                      status:
                        type: string

                      lastTransitionTime:
                        type: string
                        format: date-time

                      reason:
                        type: string

                      message:
                        type: string
