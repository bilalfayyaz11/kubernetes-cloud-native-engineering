apiVersion: v1
kind: Pod
metadata:
  name: fixed-pod
  namespace: resource-governance
  labels:
    app: fixed-resource-workload
spec:
  containers:
    - name: fixed-container
      image: nginx:alpine

      resources:
        requests:
          memory: "32Mi"
          cpu: "50m"

        limits:
          memory: "64Mi"
          cpu: "100m"
