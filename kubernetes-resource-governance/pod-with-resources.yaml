apiVersion: v1
kind: Pod
metadata:
  name: resource-demo-pod
  namespace: resource-governance
  labels:
    app: resource-demo
    component: resource-governance
spec:
  containers:
    - name: demo-container
      image: nginx:alpine

      ports:
        - containerPort: 80

      resources:
        requests:
          memory: "64Mi"
          cpu: "250m"
        limits:
          memory: "128Mi"
          cpu: "500m"
