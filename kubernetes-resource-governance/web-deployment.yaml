apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: resource-governance
  labels:
    app: web-app
spec:
  replicas: 3

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: web-container
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "32Mi"
              cpu: "100m"
            limits:
              memory: "64Mi"
              cpu: "200m"
