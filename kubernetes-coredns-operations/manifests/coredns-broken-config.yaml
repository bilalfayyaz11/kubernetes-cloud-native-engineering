apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready

        # Kubernetes plugin intentionally removed.
        # External forwarding remains available, but Kubernetes
        # service discovery under cluster.local will fail.

        prometheus :9153

        forward . /etc/resolv.conf {
            max_concurrent 1000
        }

        cache 30
        loop
        reload
        loadbalance
    }
