apiVersion: v1
kind: Pod
metadata:
  name: dns-test-pod
  namespace: default
  labels:
    app: dns-test
spec:
  restartPolicy: Always
  containers:
  - name: dns-tools
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      while true; do
        sleep 3600
      done
    resources:
      requests:
        cpu: "10m"
        memory: "16Mi"
      limits:
        cpu: "50m"
        memory: "64Mi"
