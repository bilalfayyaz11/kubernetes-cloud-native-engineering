apiVersion: v1
kind: Pod
metadata:
  name: dns-load-test
  namespace: default
  labels:
    app: dns-load-test
spec:
  restartPolicy: Never
  containers:
  - name: load-tester
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      PASS=0
      FAIL=0

      i=1
      while [ "$i" -le 100 ]; do
        if nslookup sample-web-service.default.svc.cluster.local >/dev/null 2>&1; then
          PASS=$((PASS + 1))
        else
          FAIL=$((FAIL + 1))
        fi

        i=$((i + 1))
        sleep 0.1
      done

      echo "DNS_LOAD_PASS=$PASS"
      echo "DNS_LOAD_FAIL=$FAIL"

      if [ "$FAIL" -eq 0 ]; then
        exit 0
      else
        exit 1
      fi
