apiVersion: v1
kind: Pod
metadata:
  name: dynamic-storage-consumer
  labels:
    app: dynamic-storage-test
spec:
  restartPolicy: Never
  containers:
    - name: storage-writer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          echo "dynamic-storage-provisioning-success" > /data/proof.txt
          echo "Pod successfully wrote data to dynamically provisioned volume"
          sleep 3600
      volumeMounts:
        - name: dynamic-storage
          mountPath: /data
  volumes:
    - name: dynamic-storage
      persistentVolumeClaim:
        claimName: dynamic-pvc
