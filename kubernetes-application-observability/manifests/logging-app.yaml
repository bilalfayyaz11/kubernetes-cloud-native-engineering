apiVersion: v1
kind: Pod
metadata:
  name: logging-app
  labels:
    app: logging-app
spec:
  containers:
    - name: logger
      image: busybox:1.36
      command:
        - sh
        - -c
      args:
        - |
          counter=1
          while true; do
            echo "$(date -Iseconds) INFO Log entry #${counter} application-running"
            if [ $((counter % 5)) -eq 0 ]; then
              echo "$(date -Iseconds) WARNING simulated-high-memory-usage"
            fi
            if [ $((counter % 10)) -eq 0 ]; then
              echo "$(date -Iseconds) ERROR simulated-application-error" >&2
            fi
            counter=$((counter + 1))
            sleep 2
          done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
