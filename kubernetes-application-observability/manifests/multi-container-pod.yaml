apiVersion: v1
kind: Pod
metadata:
  name: multi-container-app
  labels:
    app: multi-container-app
spec:
  containers:
    - name: web-server
      image: nginx:1.27
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 96Mi

    - name: log-processor
      image: busybox:1.36
      command:
        - sh
        - -c
      args:
        - |
          counter=1
          while true; do
            echo "$(date -Iseconds) INFO processing-web-server-log-batch=${counter}"
            if [ $((counter % 3)) -eq 0 ]; then
              echo "$(date -Iseconds) WARNING delayed-log-processing"
            fi
            counter=$((counter + 1))
            sleep 5
          done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
