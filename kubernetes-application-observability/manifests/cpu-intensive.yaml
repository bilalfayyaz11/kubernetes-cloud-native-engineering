apiVersion: v1
kind: Pod
metadata:
  name: cpu-intensive
  labels:
    app: cpu-intensive
spec:
  containers:
    - name: cpu-load
      image: busybox:1.36
      command:
        - sh
        - -c
      args:
        - |
          echo "Starting controlled CPU load"
          while true; do
            i=0
            while [ "$i" -lt 250000 ]; do
              i=$((i + 1))
            done
          done
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 96Mi
