apiVersion: v1
kind: Pod
metadata:
  name: problematic-app
  labels:
    app: problematic-app
spec:
  containers:
    - name: app
      image: nginx:1.27
      ports:
        - containerPort: 80
      volumeMounts:
        - name: config-volume
          mountPath: /etc/nginx/conf.d
      livenessProbe:
        httpGet:
          path: /health
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 5
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 96Mi
  volumes:
    - name: config-volume
      configMap:
        name: nonexistent-config
