apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml
  - path: service-patch.yaml

replicas:
  - name: webapp
    count: 2

labels:
  - pairs:
      environment: staging
    includeSelectors: false
    includeTemplates: true
