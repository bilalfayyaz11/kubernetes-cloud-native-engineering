apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

patches:
  - path: deployment-patch.yaml

replicas:
  - name: webapp
    count: 5

images:
  - name: nginx
    newTag: "1.28-alpine"

labels:
  - pairs:
      environment: production
    includeSelectors: false
    includeTemplates: true
