apiVersion: v1
kind: Service
metadata:
  labels:
    environment: production
    managed-by: kustomize
  name: webapp-service
  namespace: production
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    environment: production
    managed-by: kustomize
  name: webapp
  namespace: production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        environment: production
        managed-by: kustomize
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: production
        image: nginx:1.28-alpine
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: webapp
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
