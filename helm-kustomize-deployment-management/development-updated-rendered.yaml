apiVersion: v1
kind: Service
metadata:
  labels:
    environment: development
    managed-by: kustomize
  name: webapp-service
  namespace: development
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: http
  selector:
    app: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    environment: development
    managed-by: kustomize
  name: webapp
  namespace: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        environment: development
        managed-by: kustomize
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: development
        - name: DEBUG
          value: "true"
        image: nginx:1.28-alpine
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        name: webapp
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        resources:
          limits:
            cpu: 50m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 32Mi
