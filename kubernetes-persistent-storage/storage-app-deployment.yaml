apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-writer
  namespace: persistent-storage
  labels:
    app: storage-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storage-writer
  template:
    metadata:
      labels:
        app: storage-writer
    spec:
      containers:
      - name: storage-container
        image: busybox:1.36
        command:
        - /bin/sh
        args:
        - -c
        - |
          while true; do
            echo "$(date)" >> /data/timestamps.log
            sleep 30
          done
        volumeMounts:
        - name: storage-volume
          mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: primary-pvc
