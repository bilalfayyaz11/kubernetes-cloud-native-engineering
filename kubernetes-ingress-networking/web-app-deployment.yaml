apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: ingress-networking
  labels:
    app: web-app
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      <title>Kubernetes Networking Demo</title>
    </head>
    <body>
      <h1>Kubernetes Networking and Ingress</h1>
      <p>Application status: healthy</p>
      <p>Service layer: Kubernetes Service</p>
      <p>Routing layer: NodePort and Ingress</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: ingress-networking
  labels:
    app: web-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html-content
          configMap:
            name: web-content
