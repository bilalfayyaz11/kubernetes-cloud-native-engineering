apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scheduling-test
  template:
    metadata:
      labels:
        app: scheduling-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
