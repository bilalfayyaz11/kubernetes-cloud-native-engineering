apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-health-test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cluster-health-test
  template:
    metadata:
      labels:
        app: cluster-health-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-health-test
spec:
  selector:
    app: cluster-health-test
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
