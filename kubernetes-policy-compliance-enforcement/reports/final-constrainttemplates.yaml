  spec:
    crd:
      spec:
        names:
          kind: K8sRequireNonRoot
        validation:
          legacySchema: false
          openAPIV3Schema:
            properties:
              exemptImages:
                items:
                  type: string
                type: array
            type: object
    targets:
    - code:
      - engine: Rego
        source:
          rego: |
            package k8srequirenonroot

            is_exempt(image) if {
              some exempt in input.parameters.exemptImages
              startswith(image, exempt)
            }

            violation contains {"msg": msg} if {
              some container in input.review.object.spec.containers
              not is_exempt(container.image)
              not container.securityContext.runAsNonRoot
              msg := sprintf(
                "Container <%v> must set securityContext.runAsNonRoot=true",
                [container.name]
              )
            }

            violation contains {"msg": msg} if {
              some container in input.review.object.spec.containers
              not is_exempt(container.image)
              container.securityContext.runAsUser == 0
              msg := sprintf(
                "Container <%v> cannot run as UID 0",
                [container.name]
              )
            }
          version: v1
      target: admission.k8s.gatekeeper.sh
