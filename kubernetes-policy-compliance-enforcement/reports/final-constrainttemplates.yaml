        {"apiVersion":"templates.gatekeeper.sh/v1","kind":"ConstraintTemplate","metadata":{"annotations":{"description":"Requires all workload containers to run as non-root"},"name":"k8srequirenonroot"},"spec":{"crd":{"spec":{"names":{"kind":"K8sRequireNonRoot"},"validation":{"openAPIV3Schema":{"properties":{"exemptImages":{"items":{"type":"string"},"type":"array"}},"type":"object"}}}},"targets":[{"code":[{"engine":"Rego","source":{"rego":"package k8srequirenonroot\n\nis_exempt(image) if {\n  some exempt in input.parameters.exemptImages\n  startswith(image, exempt)\n}\n\nviolation contains {\"msg\": msg} if {\n  some container in input.review.object.spec.containers\n  not is_exempt(container.image)\n  not container.securityContext.runAsNonRoot\n  msg := sprintf(\n    \"Container \u003c%v\u003e must set securityContext.runAsNonRoot=true\",\n    [container.name]\n  )\n}\n\nviolation contains {\"msg\": msg} if {\n  some container in input.review.object.spec.containers\n  not is_exempt(container.image)\n  container.securityContext.runAsUser == 0\n  msg := sprintf(\n    \"Container \u003c%v\u003e cannot run as UID 0\",\n    [container.name]\n  )\n}\n","version":"v1"}}],"target":"admission.k8s.gatekeeper.sh"}]}}
