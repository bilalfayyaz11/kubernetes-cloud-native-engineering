apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenonroot
  annotations:
    description: Requires all workload containers to run as non-root
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNonRoot
      validation:
        openAPIV3Schema:
          type: object
          properties:
            exemptImages:
              type: array
              items:
                type: string
  targets:
  - target: admission.k8s.gatekeeper.sh
    code:
    - engine: Rego
      source:
        version: "v1"
        rego: |
          package k8srequirenonroot

          is_exempt(image) if {
            some exempt in input.parameters.exemptImages
            startswith(image, exempt)
          }

          violation contains {"msg": msg} if {
            some container in input.review.object.spec.containers
            not is_exempt(container.image)
            not container.securityContext.runAsNonRoot
            msg := sprintf(
              "Container <%v> must set securityContext.runAsNonRoot=true",
              [container.name]
            )
          }

          violation contains {"msg": msg} if {
            some container in input.review.object.spec.containers
            not is_exempt(container.image)
            container.securityContext.runAsUser == 0
            msg := sprintf(
              "Container <%v> cannot run as UID 0",
              [container.name]
            )
          }
