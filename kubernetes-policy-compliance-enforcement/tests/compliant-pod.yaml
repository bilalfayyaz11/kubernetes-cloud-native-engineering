apiVersion: v1
kind: Pod
metadata:
  name: compliant
  namespace: default
spec:
  containers:
  - name: busybox
    image: busybox:latest
    command:
    - sh
    - -c
    - sleep 3600
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      privileged: false
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
