apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliant-app
  namespace: default
  labels:
    app: compliant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliant-app
  template:
    metadata:
      labels:
        app: compliant-app
    spec:
      containers:
      - name: app
        image: busybox:latest
        command:
        - sh
        - -c
        - sleep 3600
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
