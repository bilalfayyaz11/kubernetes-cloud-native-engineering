apiVersion: apps/v1
kind: Deployment
metadata:
  name: non-compliant-app
  namespace: default
  labels:
    app: non-compliant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: non-compliant-app
  template:
    metadata:
      labels:
        app: non-compliant-app
    spec:
      containers:
      - name: app
        image: busybox:latest
        command:
        - sh
        - -c
        - sleep 3600
        securityContext:
          runAsUser: 0
          privileged: true
