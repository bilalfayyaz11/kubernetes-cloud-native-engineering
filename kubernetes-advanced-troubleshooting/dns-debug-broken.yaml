apiVersion: v1
kind: Pod
metadata:
  name: dns-debug
  namespace: network-debug
  labels:
    app: dns-debug
spec:
  dnsPolicy: None
  dnsConfig:
    nameservers:
      - 192.0.2.53
    searches:
      - invalid.example
    options:
      - name: ndots
        value: "1"
  containers:
    - name: network-tools
      image: nicolaka/netshoot:latest
      command:
        - sh
        - -c
        - sleep infinity
