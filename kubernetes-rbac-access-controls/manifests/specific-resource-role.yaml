apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: specific-resource-access
  namespace: development
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - app-config
      - database-config
    verbs:
      - get
      - update
      - patch
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - create
