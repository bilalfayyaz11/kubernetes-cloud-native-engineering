apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: default
  labels:
    app: load-generator
spec:
  containers:
    - name: load-generator
      image: busybox:1.36.1
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            wget -q -O /dev/null http://sample-web-app-service.default.svc.cluster.local/
            sleep 0.2
          done
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 32Mi
  restartPolicy: Never
