grafana:
  enabled: true
  adminUser: admin
  adminPassword: "Uzo/jU22bsNUwu5UipGb9pn+"

  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 1Gi

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

prometheus:
  enabled: true

  prometheusSpec:
    retention: 6h
    retentionSize: 2GB

    resources:
      requests:
        cpu: 150m
        memory: 400Mi
      limits:
        cpu: 750m
        memory: 1Gi

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 3Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 150m
        memory: 192Mi

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 250m
      memory: 256Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 25m
      memory: 50Mi
    limits:
      cpu: 150m
      memory: 150Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 25m
      memory: 30Mi
    limits:
      cpu: 100m
      memory: 100Mi

# K3s embeds these control-plane components rather than exposing
# them as standalone scrape targets in the same way as kubeadm.
kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
