apiVersion: v1
kind: Pod
metadata:
  name: no-toleration-test
  labels:
    app: no-toleration-test
spec:
  nodeSelector:
    kubernetes.io/hostname: "scheduling-policy-worker"
  containers:
    - name: test
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 20m
          memory: 16Mi
