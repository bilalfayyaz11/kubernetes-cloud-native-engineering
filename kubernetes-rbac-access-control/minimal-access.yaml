apiVersion: v1
kind: ServiceAccount
metadata:
  name: minimal-service-account
  namespace: access-control
  labels:
    security.kubernetes.io/purpose: least-privilege
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: minimal-role
  namespace: access-control
  labels:
    security.kubernetes.io/purpose: least-privilege
rules:
  - apiGroups: [""]
    resources:
      - pods
    resourceNames:
      - restricted-target
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: minimal-rolebinding
  namespace: access-control
subjects:
  - kind: ServiceAccount
    name: minimal-service-account
    namespace: access-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: minimal-role
