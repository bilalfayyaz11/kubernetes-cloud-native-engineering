apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: database-rolebinding
  namespace: access-control
subjects:
  - kind: ServiceAccount
    name: database-service-account
    namespace: access-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: database-role
