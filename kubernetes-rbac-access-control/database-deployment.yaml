apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: access-control
  labels:
    app: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      serviceAccountName: database-service-account
      automountServiceAccountToken: true
      containers:
        - name: database-client
          image: curlimages/curl:8.12.1
          command:
            - sh
            - -c
            - sleep 3600
          env:
            - name: SERVICE_ACCOUNT
              value: database-service-account
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
