apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webapp-role
  namespace: access-control
  labels:
    app.kubernetes.io/name: webapp
    security.kubernetes.io/purpose: least-privilege
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list

  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
