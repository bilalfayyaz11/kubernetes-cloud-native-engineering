apiVersion: v1
kind: ConfigMap
metadata:
  name: api-content
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Backend API</title>
    </head>
    <body>
      <h1>Backend API</h1>
      <p>Service: API Application</p>
      <p>Route: /api</p>
      <p>Status: Active</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-app
  labels:
    app: api-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-app
  template:
    metadata:
      labels:
        app: api-app
    spec:
      containers:
        - name: api-app
          image: nginx:1.27
          ports:
            - containerPort: 80
          volumeMounts:
            - name: api-content
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
      volumes:
        - name: api-content
          configMap:
            name: api-content
---
apiVersion: v1
kind: Service
metadata:
  name: api-app-service
spec:
  type: ClusterIP
  selector:
    app: api-app
  ports:
    - name: http
      port: 80
      targetPort: 80
