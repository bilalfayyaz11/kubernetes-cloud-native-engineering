apiVersion: v1
kind: ResourceQuota
metadata:
  name: secure-apps-quota
  namespace: secure-apps

spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi

    limits.cpu: "2"
    limits.memory: 2Gi

    pods: "10"
    services: "5"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: secure-apps-limits
  namespace: secure-apps

spec:
  limits:
  - type: Container

    default:
      cpu: 250m
      memory: 256Mi

    defaultRequest:
      cpu: 50m
      memory: 64Mi

    max:
      cpu: "1"
      memory: 1Gi

    min:
      cpu: 5m
      memory: 8Mi
