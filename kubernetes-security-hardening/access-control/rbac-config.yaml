apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: secure-apps

automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: secure-apps

rules:
- apiGroups:
  - ""

  resources:
  - pods

  verbs:
  - get
  - list
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-reader-binding
  namespace: secure-apps

subjects:
- kind: ServiceAccount
  name: app-service-account
  namespace: secure-apps

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader
