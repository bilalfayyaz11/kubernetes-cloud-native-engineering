apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-web
  namespace: secure-apps
spec:
  replicas: 1

  selector:
    matchLabels:
      app: secure-web

  template:
    metadata:
      labels:
        app: secure-web

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: secure-web
        image: secure-web:v1.0.0
        imagePullPolicy: Never

        ports:
        - containerPort: 8080

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true

          capabilities:
            drop:
            - ALL

        resources:
          requests:
            cpu: 20m
            memory: 32Mi

          limits:
            cpu: 100m
            memory: 64Mi

        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        volumeMounts:
        - name: tmp
          mountPath: /tmp

        - name: cache
          mountPath: /var/cache/nginx

      volumes:
      - name: tmp
        emptyDir: {}

      - name: cache
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: secure-web
  namespace: secure-apps
spec:
  selector:
    app: secure-web

  ports:
  - port: 80
    targetPort: 8080

  type: ClusterIP
