apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: frontend
spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend
        tier: frontend

    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:alpine

          ports:
            - containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx

            - name: run
              mountPath: /var/run

            - name: tmp
              mountPath: /tmp

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi

      volumes:
        - name: cache
          emptyDir: {}

        - name: run
          emptyDir: {}

        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: frontend
spec:
  selector:
    app: frontend

  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP

  type: ClusterIP
