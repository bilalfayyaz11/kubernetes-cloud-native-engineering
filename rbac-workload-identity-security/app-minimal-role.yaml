apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-minimal-role
  namespace: secure-app
rules:
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list

  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - app-secret
    verbs:
      - get
