apiVersion: audit.k8s.io/v1
kind: Policy

omitStages:
- RequestReceived

rules:

# Secrets: metadata only.
# Never log request or response bodies for sensitive Secret objects.
- level: Metadata
  resources:
  - group: ""
    resources:
    - secrets

# Authentication and authorization related API activity.
- level: Request
  nonResourceURLs:
  - "/api*"
  - "/apis*"

# Security-sensitive RBAC changes.
- level: Request
  resources:
  - group: "rbac.authorization.k8s.io"
    resources:
    - roles
    - rolebindings
    - clusterroles
    - clusterrolebindings
  verbs:
  - create
  - update
  - patch
  - delete

# Workload changes.
- level: Request
  resources:
  - group: ""
    resources:
    - pods
    - serviceaccounts
  - group: "apps"
    resources:
    - deployments
    - daemonsets
    - statefulsets
  verbs:
  - create
  - update
  - patch
  - delete

# Namespace operations.
- level: Request
  resources:
  - group: ""
    resources:
    - namespaces
  verbs:
  - create
  - update
  - patch
  - delete

# Metadata for all remaining requests.
- level: Metadata
