apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: secure-namespace
  labels:
    app: secure-pod
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: app
    image: busybox:1.36
    command:
    - sh
    - -c
    - sleep infinity
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      capabilities:
        drop:
        - ALL
