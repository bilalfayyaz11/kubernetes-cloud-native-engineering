apiVersion: v1
kind: Pod
metadata:
  name: api-connectivity-test
  namespace: endpoint-security
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: curlimages/curl:8.11.1
      command:
        - /bin/sh
        - -c
        - sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 10001
        capabilities:
          drop:
            - ALL
