apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-sensitive-egress
  namespace: endpoint-security
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:

    # Preserve cluster DNS.
    - to:
        - ipBlock:
            cidr: 10.43.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow ordinary IPv4 egress while excluding link-local space.
    # This explicitly excludes EC2 IMDS at 169.254.169.254.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16
