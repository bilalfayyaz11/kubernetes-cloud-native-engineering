apiVersion: v1
kind: ConfigMap
metadata:
  name: sample-app-config
  namespace: sample-app

data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>GitOps Delivery</title>
    </head>
    <body>
      <h1>GitOps Delivery Active</h1>
      <p>This content is managed declaratively through Git and synchronized by Argo CD.</p>
      <p>Version: 2.0</p>
    </body>
    </html>

  app.properties: |
    environment=production
    debug=false
    max_connections=100
