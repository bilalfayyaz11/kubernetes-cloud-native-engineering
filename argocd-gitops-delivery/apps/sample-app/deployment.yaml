apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
  namespace: sample-app
  labels:
    app: sample-app
    app.kubernetes.io/name: sample-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: sample-app

  template:
    metadata:
      labels:
        app: sample-app
        app.kubernetes.io/name: sample-app

    spec:
      containers:
      - name: web
        image: nginx:1.29-alpine

        ports:
        - name: http
          containerPort: 80

        resources:
          requests:
            cpu: 25m
            memory: 32Mi

          limits:
            cpu: 150m
            memory: 96Mi

        readinessProbe:
          httpGet:
            path: /
            port: http

          initialDelaySeconds: 3
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /
            port: http

          initialDelaySeconds: 10
          periodSeconds: 10
