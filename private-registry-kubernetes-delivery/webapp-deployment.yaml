apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: container-platform
  labels:
    app: webapp
spec:
  replicas: 3

  selector:
    matchLabels:
      app: webapp

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: webapp

    spec:
      imagePullSecrets:
        - name: harbor-secret

      containers:
        - name: webapp
          image: host.minikube.internal:80/platform-images/webapp:v1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8080
              name: http

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: container-platform
spec:
  selector:
    app: webapp

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080

  type: ClusterIP
