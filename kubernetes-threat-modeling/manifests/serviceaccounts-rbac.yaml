apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: threat-modeling
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: threat-modeling
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restricted-sa
  namespace: threat-modeling
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restricted-pod-reader
  namespace: threat-modeling
rules:
- apiGroups: [""]
  resources:
  - pods
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restricted-pod-reader
  namespace: threat-modeling
subjects:
- kind: ServiceAccount
  name: restricted-sa
  namespace: threat-modeling
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restricted-pod-reader
