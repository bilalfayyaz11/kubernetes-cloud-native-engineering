apiVersion: v1
kind: Pod
metadata:
  name: secure-pod
  namespace: threat-modeling
  labels:
    app: secure-pod
spec:
  serviceAccountName: restricted-sa
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: secure
    image: alpine:3.21
    command:
    - sh
    - -c
    - |
      apk add --no-cache curl busybox-extras >/dev/null 2>&1
      sleep infinity
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 64Mi
