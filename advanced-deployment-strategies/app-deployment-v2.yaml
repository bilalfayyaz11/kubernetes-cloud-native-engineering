apiVersion: v1
kind: ConfigMap
metadata:
  name: app-content-v2
  namespace: deployment-strategies
  labels:
    app: sample-app
    version: v2
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Sample App v2</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                background-color: #e8f5e9;
                margin: 0;
                padding: 40px;
            }
            .container {
                margin-top: 80px;
            }
            .version {
                color: #2e7d32;
                font-size: 24px;
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Sample Application</h1>
            <p class="version">Version 2.0 - Green Environment</p>
            <p>This is the updated production candidate.</p>
        </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-v2
  namespace: deployment-strategies
  labels:
    app: sample-app
    version: v2
spec:
  replicas: 3

  selector:
    matchLabels:
      app: sample-app
      version: v2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: sample-app
        version: v2

    spec:
      containers:
        - name: web-server
          image: nginx:alpine

          ports:
            - name: http
              containerPort: 80

          env:
            - name: VERSION
              value: "v2.0"

          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: html-content
          configMap:
            name: app-content-v2
