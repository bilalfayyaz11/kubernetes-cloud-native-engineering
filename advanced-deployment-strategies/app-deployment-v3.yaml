apiVersion: v1
kind: ConfigMap
metadata:
  name: app-content-v3
  namespace: deployment-strategies
  labels:
    app: sample-app
    version: v3
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <meta charset="UTF-8">
        <title>Sample App v3</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                text-align: center;
                background-color: #fff3e0;
                margin: 0;
                padding: 40px;
            }
            .container {
                margin-top: 80px;
            }
            .version {
                color: #f57c00;
                font-size: 24px;
                font-weight: bold;
            }
            .canary {
                display: inline-block;
                padding: 10px 20px;
                background-color: #ffcc02;
                border-radius: 8px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Sample Application</h1>
            <p class="version">Version 3.0 - Canary Release</p>
            <div class="canary">CANARY VERSION</div>
            <p>Experimental production candidate.</p>
        </div>
    </body>
    </html>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app-v3
  namespace: deployment-strategies
  labels:
    app: sample-app
    version: v3
spec:
  replicas: 1

  selector:
    matchLabels:
      app: sample-app
      version: v3

  template:
    metadata:
      labels:
        app: sample-app
        version: v3

    spec:
      containers:
        - name: web-server
          image: nginx:alpine

          ports:
            - name: http
              containerPort: 80

          volumeMounts:
            - name: html-content
              mountPath: /usr/share/nginx/html
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

      volumes:
        - name: html-content
          configMap:
            name: app-content-v3
