apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: network-segmentation
  labels:
    app: test-client
    tier: testing
spec:
  containers:
    - name: test-client
      image: busybox:1.37
      command:
        - sh
        - -c
        - sleep 3600
      resources:
        requests:
          memory: "16Mi"
          cpu: "10m"
        limits:
          memory: "64Mi"
          cpu: "50m"
