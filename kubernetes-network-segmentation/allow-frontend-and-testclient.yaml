apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-and-testclient
  namespace: network-segmentation
spec:
  podSelector:
    matchLabels:
      app: backend

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend

        - podSelector:
            matchLabels:
              app: test-client

      ports:
        - protocol: TCP
          port: 5432
