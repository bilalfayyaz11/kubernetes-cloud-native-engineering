apiVersion: v1
kind: Pod
metadata:
  name: capability-violation-app
  namespace: restricted-test
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          add:
            - NET_ADMIN
  restartPolicy: Never
