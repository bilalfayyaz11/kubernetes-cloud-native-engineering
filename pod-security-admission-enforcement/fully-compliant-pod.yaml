apiVersion: v1
kind: Pod
metadata:
  name: fully-compliant-app
  namespace: restricted-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: app
      image: registry.k8s.io/pause:3.10.1

      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        capabilities:
          drop:
            - ALL

  restartPolicy: Never
