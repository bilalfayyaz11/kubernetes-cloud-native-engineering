apiVersion: v1
kind: Pod
metadata:
  name: compliant-app
  namespace: baseline-test
spec:
  containers:
    - name: app
      image: nginx:1.28-alpine
      ports:
        - containerPort: 80
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 101
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
