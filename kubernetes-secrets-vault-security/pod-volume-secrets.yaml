apiVersion: v1
kind: Pod
metadata:
  name: secret-volume-pod
spec:
  containers:
    - name: app
      image: alpine:3.20
      command:
        - sh
        - -c
        - |
          echo "Secret volumes mounted"
          while true; do
            sleep 30
          done
      volumeMounts:
        - name: credential-volume
          mountPath: /etc/secrets
          readOnly: true
        - name: tls-volume
          mountPath: /etc/tls
          readOnly: true
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
  volumes:
    - name: credential-volume
      secret:
        secretName: user-credentials
        defaultMode: 0400
    - name: tls-volume
      secret:
        secretName: tls-secret
        defaultMode: 0400
  restartPolicy: Never
