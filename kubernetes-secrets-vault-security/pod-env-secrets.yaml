apiVersion: v1
kind: Pod
metadata:
  name: secret-env-pod
spec:
  containers:
    - name: app
      image: alpine:3.20
      command:
        - sh
        - -c
        - |
          echo "Secret-backed environment variables loaded"
          while true; do
            sleep 30
          done
      env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: user-credentials
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: user-credentials
              key: password
        - name: DATABASE_HOST
          valueFrom:
            secretKeyRef:
              name: database-secret
              key: db-host
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
