apiVersion: v1
kind: Pod
metadata:
  name: vault-sidecar-pod
  namespace: default
spec:
  serviceAccountName: vault-auth

  containers:
    - name: vault-agent
      image: hashicorp/vault:2.1.1
      imagePullPolicy: IfNotPresent
      command:
        - vault
        - agent
        - -config=/vault/config/vault-agent.hcl

      env:
        - name: VAULT_ADDR
          value: "http://VAULT_PRIVATE_ENDPOINT:8200"

      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: vault-config
          mountPath: /vault/config
          readOnly: true

        - name: vault-secrets
          mountPath: /vault/secrets

    - name: myapp
      image: alpine:3.20

      command:
        - sh
        - -c
        - |
          while true; do
            if [ -s /vault/secrets/app-config ]; then
              echo "Vault-rendered application configuration is available"
            else
              echo "Waiting for Vault-rendered configuration"
            fi
            sleep 30
          done

      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        capabilities:
          drop:
            - ALL

      volumeMounts:
        - name: vault-secrets
          mountPath: /vault/secrets
          readOnly: true

  volumes:
    - name: vault-config
      configMap:
        name: vault-agent-config

    - name: vault-secrets
      emptyDir:
        medium: Memory

  restartPolicy: Never
