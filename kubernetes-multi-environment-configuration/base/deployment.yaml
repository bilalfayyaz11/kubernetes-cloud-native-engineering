apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
spec:
  replicas: 2

  selector:
    matchLabels:
      app: web-app

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: web-app
          image: nginx:1.29.1-alpine

          ports:
            - name: http
              containerPort: 80

          resources:
            requests:
              memory: 64Mi
              cpu: 100m
            limits:
              memory: 128Mi
              cpu: 250m
