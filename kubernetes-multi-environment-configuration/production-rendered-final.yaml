apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    description: Reusable web application base configuration
  labels:
    environment: production
    managed-by: kustomize
    tier: production
    version: v1.0.0
  name: prod-web-app
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: web-app
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        description: Reusable web application base configuration
      labels:
        app: web-app
        environment: production
        managed-by: kustomize
        tier: production
        version: v1.0.0
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: production
        image: nginx:1.29.1-alpine
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          periodSeconds: 15
          timeoutSeconds: 5
        name: web-app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: 750m
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 128Mi
        startupProbe:
          failureThreshold: 12
          httpGet:
            path: /
            port: 80
          periodSeconds: 5
          timeoutSeconds: 3
