apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

namePrefix: staging-

labels:
  - pairs:
      environment: staging
      tier: non-production
    includeSelectors: false
    includeTemplates: true

replicas:
  - name: web-app
    count: 1

patches:
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
