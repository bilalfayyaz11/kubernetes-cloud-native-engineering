apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-monitor
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: security-monitor

  template:
    metadata:
      labels:
        app: security-monitor

    spec:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: monitor
          image: alpine:3.20

          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "Security monitoring active at $(date)"
                sleep 60
              done

          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
