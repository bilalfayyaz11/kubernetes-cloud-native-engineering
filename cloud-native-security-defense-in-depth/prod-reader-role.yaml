apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-reader-role
  namespace: production
rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - configmaps
    verbs:
      - get
      - list

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
