global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    retries 3
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend kubernetes-api
    bind *:6443
    mode tcp
    default_backend kubernetes-api-backend

backend kubernetes-api-backend
    mode tcp
    balance roundrobin
    option tcp-check
    default-server inter 2s fall 2 rise 2
    server k8s-server1 172.30.0.21:6443 check
    server k8s-server2 172.30.0.22:6443 check
    server k8s-server3 172.30.0.23:6443 check

listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
