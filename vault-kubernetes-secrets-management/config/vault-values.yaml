global:
  enabled: true

injector:
  enabled: false

server:
  enabled: true

  standalone:
    enabled: true
    config: |
      ui = false

      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_disable     = 1
      }

      storage "file" {
        path = "/vault/data"
      }

      disable_mlock = true

  dataStorage:
    enabled: false

  auditStorage:
    enabled: false

  service:
    enabled: true

  readinessProbe:
    enabled: true
    path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204

ui:
  enabled: false
