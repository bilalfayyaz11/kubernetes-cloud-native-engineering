apiVersion: apps/v1
kind: Deployment
metadata:
  name: signed-app
  namespace: supply-chain-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: signed-app
  template:
    metadata:
      labels:
        app: signed-app
    spec:
      containers:
        - name: app
          image: localhost:5001/secure-app@sha256:<IMAGE_DIGEST>
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
