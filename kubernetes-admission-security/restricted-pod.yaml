apiVersion: v1
kind: Pod
metadata:
  name: restricted-pod
  labels:
    app: restricted-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: restricted-container
      image: busybox:1.37
      command:
        - sh
        - -c
        - |
          while true; do
            echo "restricted workload running"
            sleep 30
          done
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
