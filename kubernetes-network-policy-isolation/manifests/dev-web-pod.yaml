apiVersion: v1
kind: Pod
metadata:
  name: web-app
  namespace: development
  labels:
    app: web
    tier: frontend
    environment: dev
spec:
  containers:
  - name: nginx
    image: nginx:1.27-alpine
    ports:
    - containerPort: 80
    resources:
      requests:
        memory: "32Mi"
        cpu: "25m"
      limits:
        memory: "96Mi"
        cpu: "100m"
