apiVersion: v1
kind: Pod
metadata:
  name: test-client
  namespace: development
  labels:
    app: client
    tier: testing
    environment: dev
    access-level: testing
spec:
  restartPolicy: Always
  containers:
  - name: client
    image: busybox:1.36
    command:
    - sh
    - -c
    - |
      while true; do
        sleep 3600
      done
    resources:
      requests:
        memory: "16Mi"
        cpu: "10m"
      limits:
        memory: "64Mi"
        cpu: "50m"
