apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-deployment
  namespace: observability-health
  labels:
    app: web-app
spec:
  replicas: 3

  selector:
    matchLabels:
      app: web-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  template:
    metadata:
      labels:
        app: web-app

    spec:
      containers:
        - name: web-container
          image: nginx:alpine

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "200m"

          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15

          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
