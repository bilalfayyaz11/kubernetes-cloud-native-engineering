apiVersion: v1
kind: Pod
metadata:
  name: resource-intensive-app
  namespace: observability-health
  labels:
    app: resource-test
spec:
  containers:
    - name: monitored-container
      image: nginx:alpine

      ports:
        - containerPort: 80

      resources:
        requests:
          memory: "64Mi"
          cpu: "50m"
        limits:
          memory: "200Mi"
          cpu: "200m"

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 5
        timeoutSeconds: 2

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 2
