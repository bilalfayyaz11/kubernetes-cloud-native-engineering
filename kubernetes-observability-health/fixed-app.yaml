apiVersion: v1
kind: Pod
metadata:
  name: fixed-app
  namespace: observability-health
  labels:
    app: debug-test-fixed
spec:
  containers:
    - name: working-container
      image: nginx:alpine

      ports:
        - containerPort: 80

      resources:
        requests:
          memory: "32Mi"
          cpu: "25m"
        limits:
          memory: "128Mi"
          cpu: "200m"

      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 2
        periodSeconds: 3
        timeoutSeconds: 2
        failureThreshold: 3
