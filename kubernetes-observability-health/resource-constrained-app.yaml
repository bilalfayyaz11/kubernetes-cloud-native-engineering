apiVersion: v1
kind: Pod
metadata:
  name: resource-constrained-app
  namespace: observability-health
  labels:
    app: constrained-resource-test
spec:
  containers:
    - name: constrained-container
      image: nginx:alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: "10Mi"
          cpu: "10m"
        limits:
          memory: "20Mi"
          cpu: "20m"
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
