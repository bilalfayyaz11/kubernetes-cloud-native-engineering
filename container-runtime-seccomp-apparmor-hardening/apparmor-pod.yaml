apiVersion: v1
kind: Pod
metadata:
  name: apparmor-test-pod
  labels:
    app: apparmor-test
spec:
  containers:
    - name: test-container
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - |
          echo "AppArmor hardened container started"
          while true; do sleep 30; done
      securityContext:
        appArmorProfile:
          type: Localhost
          localhostProfile: containers.restricted-container
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
