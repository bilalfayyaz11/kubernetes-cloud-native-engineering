apiVersion: v1
kind: Pod
metadata:
  name: hardened-test-pod
  labels:
    app: hardened-test
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/restricted-profile.json

  containers:
    - name: secure-container
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - |
          echo "Defense-in-depth container started"
          while true; do sleep 30; done

      securityContext:
        appArmorProfile:
          type: Localhost
          localhostProfile: containers.restricted-container

        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: true

        capabilities:
          drop:
            - ALL

      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

      volumeMounts:
        - name: tmp
          mountPath: /tmp

  volumes:
    - name: tmp
      emptyDir: {}

  restartPolicy: Never
