apiVersion: v1
kind: Pod
metadata:
  name: seccomp-test-pod
  labels:
    app: seccomp-test
spec:
  securityContext:
    seccompProfile:
      type: Localhost
      localhostProfile: profiles/restricted-profile.json
  containers:
    - name: test-container
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - |
          echo "seccomp hardened container started"
          while true; do sleep 30; done
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
  restartPolicy: Never
