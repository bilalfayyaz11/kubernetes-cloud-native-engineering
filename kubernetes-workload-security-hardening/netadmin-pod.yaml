apiVersion: v1
kind: Pod
metadata:
  name: netadmin-pod
  labels:
    app: network-admin-demo
spec:
  restartPolicy: Never

  containers:
    - name: network-tools
      image: nicolaka/netshoot:latest

      command:
        - /bin/sh
        - -c

      args:
        - sleep 3600

      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true

        capabilities:
          drop:
            - ALL
          add:
            - NET_ADMIN

        seccompProfile:
          type: RuntimeDefault

      volumeMounts:
        - name: tmp-volume
          mountPath: /tmp

  volumes:
    - name: tmp-volume
      emptyDir: {}
