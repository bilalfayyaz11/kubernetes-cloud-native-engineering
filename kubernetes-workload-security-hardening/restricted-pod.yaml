apiVersion: v1
kind: Pod
metadata:
  name: restricted-pod
  labels:
    app: security-demo-restricted
spec:
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: demo-container
      image: nginx:1.29-alpine

      command:
        - /bin/sh
        - -c

      args:
        - sleep 3600

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000

        capabilities:
          drop:
            - ALL

        seccompProfile:
          type: RuntimeDefault

      volumeMounts:
        - name: tmp-volume
          mountPath: /tmp

        - name: var-cache-nginx
          mountPath: /var/cache/nginx

        - name: var-run
          mountPath: /var/run

  volumes:
    - name: tmp-volume
      emptyDir: {}

    - name: var-cache-nginx
      emptyDir: {}

    - name: var-run
      emptyDir: {}
