apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    worker_processes 1;

    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        access_log /tmp/access.log;
        error_log /tmp/error.log;

        server {
            listen 8080;

            location / {
                return 200 'Hello from Secure Web App!\n';
                add_header Content-Type text/plain;
            }
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  name: secure-webapp
  labels:
    app: secure-web
spec:
  restartPolicy: Never

  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    runAsGroup: 1001
    fsGroup: 1001
    seccompProfile:
      type: RuntimeDefault

  containers:
    - name: webapp
      image: nginx:1.29-alpine

      ports:
        - containerPort: 8080

      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1001

        capabilities:
          drop:
            - ALL

        seccompProfile:
          type: RuntimeDefault

      volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true

        - name: tmp-volume
          mountPath: /tmp

        - name: var-cache-nginx
          mountPath: /var/cache/nginx

        - name: var-run
          mountPath: /var/run

  volumes:
    - name: nginx-config
      configMap:
        name: nginx-config

    - name: tmp-volume
      emptyDir: {}

    - name: var-cache-nginx
      emptyDir: {}

    - name: var-run
      emptyDir: {}
