apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo-app
  labels:
    app: probe-demo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: probe-demo

  template:
    metadata:
      labels:
        app: probe-demo

    spec:
      containers:
        - name: web-app
          image: nginx:1.29-alpine

          command:
            - /bin/sh
            - -c

          args:
            - |
              echo "startup" > /usr/share/nginx/html/startup
              echo "ready" > /usr/share/nginx/html/ready
              echo "healthy" > /usr/share/nginx/html/health
              exec nginx -g 'daemon off;'

          ports:
            - name: http
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /startup
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

      volumes:
        - name: nginx-config
          configMap:
            name: probe-demo-config
