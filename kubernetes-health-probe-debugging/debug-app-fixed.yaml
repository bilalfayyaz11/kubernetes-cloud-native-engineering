apiVersion: apps/v1
kind: Deployment
metadata:
  name: debug-app
  labels:
    app: debug-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: debug-app

  template:
    metadata:
      labels:
        app: debug-app

    spec:
      containers:
        - name: debug-container
          image: nginx:1.29-alpine

          ports:
            - name: http
              containerPort: 80

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
