apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-probe-app
  labels:
    app: python-probe-app
spec:
  replicas: 1

  selector:
    matchLabels:
      app: python-probe-app

  template:
    metadata:
      labels:
        app: python-probe-app

    spec:
      containers:
        - name: python-app
          image: python:3.13-slim

          command:
            - /bin/sh
            - -c

          args:
            - |
              cat > /app.py <<'PYEOF'
              import http.server
              import socketserver
              import os

              class HealthHandler(http.server.BaseHTTPRequestHandler):
                  def log_message(self, fmt, *args):
                      print(
                          f"{self.client_address[0]} "
                          f"{self.command} {self.path} "
                          f"{fmt % args}",
                          flush=True,
                      )

                  def do_GET(self):
                      if self.path == "/health":
                          if os.path.exists("/tmp/healthy"):
                              self.send_response(200)
                              body = b"Healthy\n"
                          else:
                              self.send_response(500)
                              body = b"Unhealthy\n"

                      elif self.path == "/ready":
                          if os.path.exists("/tmp/ready"):
                              self.send_response(200)
                              body = b"Ready\n"
                          else:
                              self.send_response(503)
                              body = b"Not Ready\n"

                      else:
                          self.send_response(200)
                          body = b"Python probe application\n"

                      self.send_header("Content-Type", "text/plain")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

              os.system("touch /tmp/healthy /tmp/ready")

              with socketserver.TCPServer(
                  ("0.0.0.0", 8080),
                  HealthHandler
              ) as httpd:
                  httpd.allow_reuse_address = True
                  print("Server running on port 8080", flush=True)
                  httpd.serve_forever()
              PYEOF

              exec python /app.py

          ports:
            - name: http
              containerPort: 8080

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 96Mi
              cpu: 200m
